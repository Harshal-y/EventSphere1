
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | EventSphere</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <main class="auth-container">
        <section class="auth-card account-card">

            <div class="brand">
                <h1>Event<span>Sphere</span></h1>
                <p>Your events. Your community.</p>
            </div>

            <h2>My Account</h2>
            <p class="auth-subtitle">Manage your EventSphere account.</p>

            <div id="accountMessage" class="auth-message"></div>

            <div class="account-details">
                <div class="account-detail">
                    <span>Full Name</span>
                    <strong id="accountName">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Email Address</span>
                    <strong id="accountEmail">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Account ID</span>
                    <strong id="accountId">Loading...</strong>
                </div>

                <div class="account-detail">
                    <span>Account Status</span>
                    <strong id="accountStatus">Checking...</strong>
                </div>
            </div>

            <button type="button" id="logoutButton" class="auth-button">
                Sign Out
            </button>

            <a href="index.html" class="auth-link">
                Back to Events
            </a>

        </section>
    </main>

    <script type="module" src="js/account-page.js"></script>

</body>
</html>
